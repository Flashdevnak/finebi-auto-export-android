plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oai.thaiscreentranslate'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oai.thaiscreentranslate'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
}
