plugins {
    id "com.android.application"
}

android {
    namespace "com.flashdevnak.finebiautoexport"
    compileSdk 35

    defaultConfig {
        applicationId "com.flashdevnak.finebiautoexport"
        minSdk 29
        targetSdk 33
        versionCode 7
        versionName "0.3.3"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file("ci-debug.keystore")
            storePassword "finebi-debug"
            keyAlias "finebi"
            keyPassword "finebi-debug"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
