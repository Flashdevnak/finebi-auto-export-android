plugins {
    id "com.android.application"
}

android {
    namespace "com.flashdevnak.finebiautoexport"
    compileSdk 35

    defaultConfig {
        applicationId "com.flashdevnak.finebiautoexport"
        minSdk 29
        targetSdk 33
        versionCode 18
        versionName "0.8.2"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile rootProject.file("ci-debug.keystore")
            storePassword "finebi-debug"
            keyAlias "finebi"
            keyPassword "finebi-debug"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Google Identity Services AuthorizationClient for Gmail send-only OAuth.
    implementation "com.google.android.gms:play-services-auth:21.5.0"
}
