plugins {
    id "com.android.application"
}

android {
    namespace "com.flashdevnak.finebiautoexport"
    compileSdk 35

    defaultConfig {
        applicationId "com.flashdevnak.finebiautoexport"
        minSdk 29
        targetSdk 33
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
