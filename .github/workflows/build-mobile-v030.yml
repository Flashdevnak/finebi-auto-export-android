name: Build Mobile v0.3.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - ".github/workflows/build-mobile-v030.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore stable signing key
        run: base64 -d .github/signing/finebi-debug.keystore.b64 > ci-debug.keystore

      - name: Set package version 0.3.0
        run: |
          sed -i 's/versionCode 3/versionCode 4/' app/build.gradle
          sed -i 's/versionName "0.2.1"/versionName "0.3.0"/' app/build.gradle

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FineBI-Auto-Export-Android-v0.3.0-mobile
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
