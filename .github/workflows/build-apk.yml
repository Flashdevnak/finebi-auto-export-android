name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/signing/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore stable debug signing key
        run: |
          base64 -d .github/signing/finebi-debug.keystore.b64 > ci-debug.keystore
          keytool -list -keystore ci-debug.keystore -storepass finebi-debug -alias finebi >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signing fingerprint
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA256: 50:DA:2D:A8:6C:00:8F:12:10:C3:C4:18:31:25:8E:E9:58:F6:DD:2D:14:51:45:CE:39:B2:E2:E4:53:D8:BE:B6"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FineBI-Auto-Export-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
