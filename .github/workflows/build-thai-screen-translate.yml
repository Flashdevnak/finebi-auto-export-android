name: Build Thai Screen Translate APK

on:
  push:
    branches:
      - chatgpt/thai-screen-translate-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ThaiScreenTranslate-v1.1.0.apk
          sha256sum ThaiScreenTranslate-v1.1.0.apk > ThaiScreenTranslate-v1.1.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThaiScreenTranslate-v1.1.0
          path: |
            ThaiScreenTranslate-v1.1.0.apk
            ThaiScreenTranslate-v1.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 14
